version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: roadtwin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATABASE_PATH=/app/data/processed/digital_twin/alerts.db
    volumes:
      - roadtwin-db-data:/app/data/processed/digital_twin

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: roadtwin-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  roadtwin-db-data:
    name: roadtwin_alerts_persistent_volume
